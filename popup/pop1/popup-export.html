<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHARMACOM Popup - Exportação</title>
  
  <!-- Font Google Sora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════════════════
       ESTILOS DO OVERLAY (MODAL BACKDROP)
    ════════════════════════════════════════════════════ */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 20px;
      font-family: 'Sora', sans-serif;
    }

    .popup-container {
      width: 100%;
      max-width: 640px; /* Largura ideal responsiva */
      position: relative;
    }

    /* ════════════════════════════════════════════════════
       POPUP COMPONENT (Aspect Ratio 2671 × 2283)
    ════════════════════════════════════════════════════ */
    .popup {
      container-type: inline-size;
      position: relative;
      width: 100%;
      aspect-ratio: 2671 / 2283;
      overflow: hidden;
      background: linear-gradient(145deg, #18181C 0%, #1d2025 50%, #202328 100%);
      border-radius: 1.87%;
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 30px 70px rgba(0, 0, 0, 0.8),
        0 0 90px rgba(255, 166, 0, 0.08);
      user-select: none;
    }

    .popup__decal {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ─── LOGO ─────────────────────────────────────────── */
    .popup__logo {
      position: absolute;
      top: 2.4%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4cqi;
      z-index: 5;
    }

    .popup__logo-svg {
      width: 27.5%;
      height: auto;
      display: block;
    }

    /* ─── HEADLINES ────────────────────────────────────── */
    .popup__headlines {
      position: absolute;
      top: 13.5%;
      left: 4%;
      right: 4%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: .5cqi;
    }

    /* Main title — golden gradient */
    .popup__title {
      font-family: 'Sora', sans-serif;
      font-size: 4.1cqi;
      font-weight: 800;
      background: linear-gradient(180deg, #FFA600 0%, #FFEDCA 50%, #FFA600 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: .04em;
      line-height: 1.05;
      text-transform: uppercase;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .5));
      white-space: nowrap;
      display: inline-block;
      transform-origin: center;
    }

    /* Sub-title line */
    .popup__subtitle {
      font-family: 'Sora', sans-serif;
      font-size: 2.9cqi;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: .05em;
      line-height: 1.1;
      text-transform: uppercase;
      text-shadow: 0 1px 12px rgba(0, 0, 0, .4);
      white-space: nowrap;
      display: inline-block;
    }

    /* Body text */
    .popup__body {
      font-family: 'Sora', sans-serif;
      font-size: 1.55cqi;
      font-weight: 400;
      color: rgba(255, 255, 255, .85);
      line-height: 1.5;
      margin-top: .1cqi;
    }

    .popup__body strong {
      color: #FFA600;
      font-weight: 700;
    }

    /* ─── WARNING STRIP ────────────────────────────────── */
    .popup__warning {
      margin-top: 0.9cqi;
      background: rgba(0, 0, 0, .45);
      border: 1px solid rgba(255, 255, 255, .08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2cqi;
      padding: 0.9cqi 2.8cqi;
      border-radius: 100cqi;
      z-index: 10;
    }

    .popup__warn-dot {
      width: 1.5cqi;
      height: 1.5cqi;
      flex-shrink: 0;
      border-radius: 50%;
      background: #FF3C3C;
    }

    .popup__warn-text {
      font-family: 'Sora', sans-serif;
      font-size: 1.3cqi;
      font-weight: 500;
      color: rgba(255, 255, 255, .95);
      white-space: nowrap;
    }

    .popup__warn-text strong {
      color: #FF5555;
      font-weight: 700;
    }

    /* Close button */
    .popup__close {
      position: absolute;
      top: 3.5%;
      right: 3.5%;
      width: 4.2cqi;
      height: 4.2cqi;
      border-radius: 50%;
      background: rgba(0, 0, 0, .4);
      border: 1px solid rgba(255, 255, 255, .1);
      color: rgba(255, 255, 255, .6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all .2s;
    }

    .popup__close:hover {
      background: rgba(255, 255, 255, .12);
      color: #ffffff;
      transform: scale(1.1);
    }

    .popup__close svg {
      width: 45%;
      height: 45%;
    }

    /* Shimmer light sweep effect */
    .popup__shine {
      position: absolute;
      top: 0;
      left: -150%;
      width: 150%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0) 35%,
        rgba(255, 255, 255, 0.08) 50%,
        rgba(255, 255, 255, 0) 65%,
        transparent 100%
      );
      transform: skewX(-20deg);
      z-index: 15;
      pointer-events: none;
    }

    @keyframes shine-sweep {
      0% {
        left: -150%;
      }
      25%, 100% {
        left: 150%;
      }
    }

    .popup__shine.active {
      animation: shine-sweep 5s ease-in-out infinite;
    }

    /* ─── BOTTLES AREA ─────────────────────────────────── */
    .popup__bottles {
      position: absolute;
      top: 41.5%;
      left: 21%;
      right: 21%;
      height: 39.5%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 6;
      padding: 0;
    }

    .popup__bottle {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: visible;
      position: relative;
      opacity: 0;
      transform: translateY(100%);
    }

    /* Cascade: heights and z-index stagger */
    .popup__bottle:nth-child(1) {
      height: 83%;
      z-index: 2;
      margin-right: -17%;
    }

    .popup__bottle:nth-child(2) {
      height: 88%;
      z-index: 3;
      margin-right: -15%;
    }

    .popup__bottle:nth-child(3) {
      height: 100%;
      z-index: 5;
      margin-top: -5%;
    }

    .popup__bottle:nth-child(4) {
      height: 88%;
      z-index: 3;
      margin-left: -15%;
    }

    .popup__bottle:nth-child(5) {
      height: 83%;
      z-index: 2;
      margin-left: -17%;
    }

    .popup__bottle img {
      display: block;
      height: 100%;
      width: auto;
      max-width: none;
      object-fit: contain;
      object-position: bottom;
    }

    /* ─── CTA BUTTONS ──────────────────────────────────── */
    .popup__cta {
      position: absolute;
      top: 89.5%;
      left: 9.3%;
      right: 9.3%;
      height: 7.2%;
      display: flex;
      gap: 2%;
      z-index: 8;
    }

    .popup__btn {
      flex: 1;
      height: 100%;
      border: none;
      border-radius: 100cqi;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      font-size: 1.25cqi;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      transition: all .2s;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .popup__btn--primary {
      background: linear-gradient(90deg, #4DC800 0%, #276500 100%);
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .4);
      box-shadow:
        inset 0 1px 0 rgba(118, 198, 255, .25),
        0 4px 20px rgba(77, 200, 0, .3);
      transform-origin: center;
    }

    .popup__btn--primary:hover {
      filter: brightness(1.12);
      box-shadow:
        inset 0 1px 0 rgba(118, 198, 255, .3),
        0 6px 30px rgba(77, 200, 0, .45);
      transform: translateY(-.5%);
    }

    .popup__btn--ghost {
      background: linear-gradient(90deg, #404040 0%, #262626 100%);
      color: rgba(255, 255, 255, .7);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow:
        inset 0 1px 0 rgba(118, 198, 255, .15),
        0 2px 12px rgba(0, 0, 0, .4);
    }

    .popup__btn--ghost:hover {
      color: rgba(255, 255, 255, .9);
      border-color: rgba(255, 255, 255, .22);
      transform: translateY(-.5%);
    }

    /* ─── PULSE / ANIMATION KEYFRAMES ───────────────────── */
    @keyframes pulse-title {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .5));
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 25px rgba(255, 166, 0, .75)) drop-shadow(0 2px 15px rgba(0, 0, 0, .6));
      }
    }

    .popup__title.pulsing {
      animation: pulse-title 2s ease-in-out infinite;
    }

    @keyframes pulse-warn {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(255, 60, 60, .5);
        transform: scale(1);
      }
      50% {
        opacity: .75;
        box-shadow: 0 0 0 .5cqi rgba(255, 60, 60, 0);
        transform: scale(1.15);
      }
    }

    .popup__warn-dot.pulsing {
      animation: pulse-warn 1.1s ease-in-out infinite;
    }

    @keyframes pulse-btn {
      0%, 100% {
        transform: scale(1);
        box-shadow: inset 0 1px 0 rgba(118, 198, 255, .25), 0 4px 20px rgba(77, 200, 0, .3);
      }
      50% {
        transform: scale(1.06);
        box-shadow:
          inset 0 1px 0 rgba(118, 198, 255, .35),
          0 8px 30px rgba(77, 200, 0, .55),
          0 0 0 .5cqi rgba(77, 200, 0, .2);
      }
    }

    .popup__btn--primary.pulsing {
      animation: pulse-btn 1.8s ease-in-out infinite;
    }
  </style>
</head>

        <!-- HEADLINES -->
        <div class="popup__headlines" id="popup-headlines">
          <h2 class="popup__title" id="popup-title">
            PRIMOBOLAN, MASTERON E OUTROS
          </h2>
          <h3 class="popup__subtitle">
            ESTÃO ACABANDO AGORA EM NOSSO ESTOQUE!
          </h3>
          <p class="popup__body">
            <strong>Falta de matéria prima global,</strong> sem previsão de reposição.<br>
            Quem usa sabe: não dá pra parar protocolo no meio do ciclo.
          </p>
          <!-- WARNING STRIP (moved inside headlines) -->
          <div class="popup__warning" id="popup-warning">
            <div class="popup__warn-dot" id="warn-dot-l"></div>
            <span class="popup__warn-text">
              <strong>Últimas unidades disponíveis.</strong> Garantia de entrega apenas para quem reservar agora.
            </span>
            <div class="popup__warn-dot" id="warn-dot-r"></div>
          </div>
        </div>

        <!-- Ordem visual (esquerda → direita): SUST300 · TEST E300 · PRIM100 · DRO P100 · BOLD300 -->
        <!-- Ordem de animação: PRIM100(1) · TEST E300(2) · DRO P100(3) · SUST300(4) · BOLD300(5) -->
        <div class="popup__bottles" id="popup-bottles">

          <!-- Frasco 4: SUST 300 (step animação 4) -->
          <div class="popup__bottle" id="bottle-sust" data-step="4">
            <img src="popup-01/SUST 300.png" alt="PHARMA SUST 300">
          </div>

          <!-- Frasco 2: TEST E300 (step animação 2) -->
          <div class="popup__bottle" id="bottle-test" data-step="2">
            <img src="popup-01/TEST E300.png" alt="PHARMA TEST E300">
          </div>

          <!-- Frasco 1: PRIM 100 — centro, mais alto (step animação 1) -->
          <div class="popup__bottle" id="bottle-prim" data-step="1">
            <img src="popup-01/PRIM 100.png" alt="PHARMA PRIM 100">
          </div>

          <!-- Frasco 3: DRO P100 (step animação 3) -->
          <div class="popup__bottle" id="bottle-dro" data-step="3">
            <img src="popup-01/DRO P100.png" alt="PHARMA DRO P100">
          </div>

          <!-- Frasco 5: BOLD 300 (step animação 5) -->
          <div class="popup__bottle" id="bottle-bold" data-step="5">
            <img src="popup-01/BOLD 300.png" alt="PHARMA BOLD 300">
          </div>

        </div><!-- /bottles -->

        <!-- CTA BUTTONS -->
        <div class="popup__cta">
          <button class="popup__btn popup__btn--primary" id="cta-main">
            QUERO GARANTIR O MEU AGORA!
          </button>
          <button class="popup__btn popup__btn--ghost" id="cta-ghost">

          </button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const popupOverlay = document.getElementById("popup-overlay");
      const popup = document.getElementById("popup-root");
      const popupShine = document.getElementById("popup-shine");
      const popupTitle = document.getElementById("popup-title");
      const ctaMain = document.getElementById("cta-main");
      const warnDotL = document.getElementById("warn-dot-l");
      const warnDotR = document.getElementById("warn-dot-r");
      const closeBtn = document.getElementById("popup-close");

      // Bottles ordered by animation step
      const bottleSust = document.getElementById("bottle-sust");
      const bottleTest = document.getElementById("bottle-test");
      const bottlePrim = document.getElementById("bottle-prim");
      const bottleDro = document.getElementById("bottle-dro");
      const bottleBold = document.getElementById("bottle-bold");

      const bottles = [
        { el: bottlePrim, delay: 500 }, // step 1 (PRIM 100)
        { el: bottleTest, delay: 700 }, // step 2 (TEST E300)
        { el: bottleDro, delay: 900 },  // step 3 (DRO P100)
        { el: bottleSust, delay: 1100 }, // step 4 (SUST 300)
        { el: bottleBold, delay: 1300 }  // step 5 (BOLD 300)
      ];

      // Reset state initially
      popupOverlay.style.opacity = "0";
      popupOverlay.style.transition = "opacity .65s ease-out";
      
      popup.style.opacity = "0";
      popup.style.transform = "scale(.78) translateY(28px)";
      popup.style.filter = "blur(8px)";
      popup.style.transition = "opacity .65s cubic-bezier(.16, 1, .3, 1), transform .65s cubic-bezier(.16, 1, .3, 1), filter .65s cubic-bezier(.16, 1, .3, 1)";

      bottles.forEach(b => {
        b.el.style.opacity = "0";
        b.el.style.transform = "translateY(100%)";
        b.el.style.transition = "opacity .5s cubic-bezier(.16, 1, .3, 1), transform .5s cubic-bezier(.16, 1, .3, 1)";
      });

      // Start sequence
      setTimeout(() => {
        // 1. Fade overlay & popup entry
        popupOverlay.style.opacity = "1";
        popup.style.opacity = "1";
        popup.style.transform = "scale(1) translateY(0)";
        popup.style.filter = "blur(0)";

        // 2. Light sweep sweep
        setTimeout(() => {
          popupShine.classList.add("active");
        }, 650);

        // 3. Bottles entrance cascade (every 200ms stagger)
        bottles.forEach(b => {
          setTimeout(() => {
            b.el.style.opacity = "1";
            b.el.style.transform = "translateY(0)";
          }, b.delay);
        });

        // 4. Pulses activation (after all bottles complete rise: 1300 + 500 = 1800ms)
        setTimeout(() => {
          popupTitle.classList.add("pulsing");
          warnDotL.classList.add("pulsing");
          warnDotR.classList.add("pulsing");
          ctaMain.classList.add("pulsing");
        }, 1850);

      }, 500);

      // Close handler
      const closePopup = () => {
        popupOverlay.style.opacity = "0";
        popup.style.opacity = "0";
        popup.style.transform = "scale(.85) translateY(20px)";
        popup.style.filter = "blur(6px)";
        setTimeout(() => {
          popupOverlay.style.display = "none";
        }, 650);
      };

      closeBtn.addEventListener("click", closePopup);
      popupOverlay.addEventListener("click", (e) => {
        if (e.target === popupOverlay) {
          closePopup();
        }
      });
    });
  </script>
